minimumReleaseAge: 4320 # 3 days in minutes
minimumReleaseAgeExclude:
  - '@tryghost/*' # first-party, we publish these
  - 'eslint-plugin-ghost' # first-party, off the @tryghost/ scope

overrides:
  # These releases declare rimraf but never call it (GHSA-3g3m-2fjr-6pw4).
  'gaxios@7.1.3>rimraf': '-'
  'google-gax@5.0.8>rimraf': '-'
  # @fastify/otel and typescript-estree still request v10 (GHSA-g3hv-75wg-m249).
  'minimatch@10': 11.0.8

# Dependency build scripts allowed to run on install (pnpm blocks them by
# default). The Docker build skips all of them via --ignore-scripts and still
# works; this only affects host/local installs.
allowBuilds:
  esbuild: true
  protobufjs: true
