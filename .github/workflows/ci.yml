name: CI

on:
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Extract node version
        id: extract-node-version
        uses: ./.github/actions/extract-node-version

      - name: Build Docker Image
        id: docker-build
        uses: ./.github/actions/docker-build
        with:
          node-version: ${{ steps.extract-node-version.outputs.node-version }}
          image-name: traffic-analytics-${{ steps.extract-node-version.outputs.node-version }}

      - name: Lint & Test
        uses: ./.github/actions/lint-and-test
        with:
          docker-image: ${{ steps.docker-build.outputs.base-image-name }}

      # The Lint & Test action leaves the cobertura report in the workspace.
      - name: Upload coverage reports
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: ./coverage/cobertura-coverage.xml
          fail_ci_if_error: false

      - name: Get tree SHA
        id: tree
        run: echo "sha=$(git rev-parse HEAD^{tree})" >> $GITHUB_OUTPUT

      - name: Output tree SHA
        run: |
          echo "Tree SHA: ${{ steps.tree.outputs.sha }}"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag & Push Docker Image
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository }}:tree-${{ steps.tree.outputs.sha }}
        run: |
          IMAGE_NAME_LOWER=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          docker tag ${{ steps.docker-build.outputs.production-image-name }} "$IMAGE_NAME_LOWER"
          docker push "$IMAGE_NAME_LOWER"

  ci-success:
    name: All required tests passed
    permissions: {}
    if: always()
    needs: [lint-and-test]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every required job succeeded
        if: ${{ needs.lint-and-test.result != 'success' }}
        run: |
          echo "One or more required CI jobs did not succeed:"
          echo "  lint-and-test: ${{ needs.lint-and-test.result }}"
          exit 1
      - name: All required CI jobs passed
        run: echo "All required CI jobs passed"
