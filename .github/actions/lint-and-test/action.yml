name: "Lint & Test"
description: "Lint and test the codebase"

inputs:
  docker-image:
    description: Which docker image to run linting and testing on
    required: true
  upload-coverage:
    description: Whether to upload the coverage report to Codecov (set true for a single matrix leg only)
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    # Lint
    - name: Lint
      shell: bash
      run: |
        export DOCKER_IMAGE=${{ inputs.docker-image }}
        docker compose -f compose.yml -f ${{ github.action_path }}/compose.ci.yml run --rm test yarn _lint

    # Test with compose (includes Firestore emulator). Mount the coverage dir
    # only on this one-off run (not on the service definition) so the E2E
    # phase, which also starts the profile-less test service, cannot clobber
    # the report on the host.
    - name: Test
      shell: bash
      run: |
        export DOCKER_IMAGE=${{ inputs.docker-image }}
        mkdir -p "${{ github.workspace }}/coverage"
        docker compose -f compose.yml -f ${{ github.action_path }}/compose.ci.yml run --rm -v "${{ github.workspace }}/coverage:/app/coverage" test

    - name: Stop services
      shell: bash
      run: |
        export DOCKER_IMAGE=${{ inputs.docker-image }}
        docker compose -f compose.yml -f ${{ github.action_path }}/compose.ci.yml down

    # E2E Test
    - name: Start services for E2E tests
      env:
        COMPOSE_PROFILES: batch,proxy
      shell: bash
      run: |
        export DOCKER_IMAGE=${{ inputs.docker-image }}
        docker compose -f compose.yml -f ${{ github.action_path }}/compose.ci.yml up -d
        
    - name: Run E2E tests
      env:
        COMPOSE_PROFILES: batch,proxy
        PROXY_TARGET: http://fake-tinybird:8080/v0/events
      shell: bash
      run: |
        export DOCKER_IMAGE=${{ inputs.docker-image }}
        docker compose -f compose.yml -f ${{ github.action_path }}/compose.ci.yml run --rm e2e-test

    # Upload coverage reports. The test service mounts ./coverage from the
    # host (see compose.ci.yml), so the cobertura report is already on disk.
    - name: Upload coverage reports
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
      if: success() && inputs.upload-coverage == 'true'
      with:
        files: ./coverage/cobertura-coverage.xml
        fail_ci_if_error: false

    # Cleanup compose services
    - name: Cleanup compose services
      shell: bash
      if: always()
      run: |
        export DOCKER_IMAGE=${{ inputs.docker-image }}
        docker compose -f compose.yml -f ${{ github.action_path }}/compose.ci.yml down
